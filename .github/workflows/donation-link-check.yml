# Flags pull requests that touch donation links, the installer or this workflow, so they get a close look
# before merging. It never fails: it adds a grey "neutral" check named "Donation links" with the lines to review.
# pull_request_target runs this file as it is on main, so a PR can't edit the check away.
# It never checks out or runs PR code: it only reads the diff through the GitHub API.
# NOTE: a tripwire for review, not a guarantee; a URL split across strings or built at runtime gets past it.
name: Donation link check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Look for changes to donation links and install scripts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # One line per changed diff line: "<file>\t<+/- line>"; files GitHub shows no diff for are listed as such
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[]
            | .filename as $f
            | if .patch == null then "\($f)\t(no diff shown)"
              else .patch | split("\n")[] | select(test("^[+-]")) | "\($f)\t\(.)" end' > lines.txt

          flagged=$( {
            # donation words in any changed line
            grep -i -E $'\t[+-].*(ko-fi|paypal|marte\\.ee|donat|sponsor|funding)' lines.txt || true
            # new URLs in code or installer files
            grep -E $'^[^\t]*\\.(cpp|h|sh|html)\t\\+.*https?://' lines.txt || true
            # files that hold the links, the installer scripts and this workflow
            grep -E $'^(\\.github/|pkg_resources/|utils/post_build\\.sh\t|source/UpdateCheck\\.(cpp|h)\t)' lines.txt || true
            # files too big for GitHub to show a diff, except .toe/.tox files and images
            grep -E $'\t\\(no diff shown\\)$' lines.txt | grep -v -i -E $'\\.(toe|tox|png|jpe?g|gif|webp)\t' || true
          } | sort -u)

          if [ -z "$flagged" ]; then
            echo "No changes to donation links or install scripts."
            exit 0
          fi
          # Indented, so PR text shows as a code block and can't turn into Markdown
          summary=$(printf 'This PR changes donation links, install scripts or this check. Review these lines before merging:\n\n'
                    printf '%s\n' "$flagged" | sed 's/^/    /')
          jq -n --arg sha "$HEAD_SHA" --arg summary "$summary" '{
            name: "Donation links", head_sha: $sha, status: "completed", conclusion: "neutral",
            output: { title: "⚠️ Review: donation links or install scripts changed", summary: $summary }
          }' | gh api "repos/$REPO/check-runs" --input - > /dev/null
          echo "Flagged lines are in the \"Donation links\" check."
